name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Mypy
        run: python -m mypy --strict app scripts evaluation

      - name: JavaScript syntax
        shell: pwsh
        run: Get-ChildItem app/static -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }

      - name: Pytest (includes Node UI suites)
        run: python -m pytest -o addopts="-q" --cov=app --cov=evaluation --cov-report=term
